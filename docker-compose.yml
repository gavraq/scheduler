services:
  cron-scheduler:
    build: .
    container_name: cron-scheduler
    restart: unless-stopped
    ports:
      - "8092:8092"
    volumes:
      - ./config:/app/config:ro
      - scheduler-data:/app/data
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY}
      - SCHEDULER_API_KEY=${SCHEDULER_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8092
      - TZ=Europe/London
    networks:
      - personal-ai
    healthcheck:
      # The image (python:3.11-slim) has no curl — use python (stdlib urllib).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8092/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  scheduler-data:

networks:
  personal-ai:
    external: true
